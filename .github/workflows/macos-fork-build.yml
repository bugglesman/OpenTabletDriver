name: macOS fork build

# Builds the patched app for Apple Silicon and attaches it to a release on tag push.
on:
  push:
    branches: [macos-click-focus-fix]
    tags: ['v*-focusfix*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/build-wrapper
        with:
          runtime: osx-arm64
          package-name: macos
          signed: true

      - name: Find package
        id: pkg
        run: echo "file=$(find . -name 'OpenTabletDriver-*_osx-arm64.tar.gz' -not -path './node_modules/*' | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenTabletDriver-osx-arm64-focusfix
          path: ${{ steps.pkg.outputs.file }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.file }}
          prerelease: true
