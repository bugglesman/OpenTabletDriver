name: macOS fork build

# Builds the patched app for Apple Silicon and attaches it to a release on tag push.
on:
  push:
    branches: [macos-click-focus-fix]
    tags: ['v*-focusfix*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/build-wrapper
        with:
          runtime: osx-arm64
          package-name: macos
          signed: true

      - name: Find package
        id: pkg
        run: echo "file=$(find . -name 'OpenTabletDriver-*_osx-arm64.tar.gz' -not -path './node_modules/*' | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenTabletDriver-osx-arm64-focusfix
          path: ${{ steps.pkg.outputs.file }}

      # Every build of the branch becomes a downloadable release; the action creates the tag.
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.8.1-focusfix${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: OpenTabletDriver 0.6.8.1 + macOS click focus fix (build ${{ github.run_number }})
          body: |
            Unofficial build of OpenTabletDriver 0.6.8.1 for Apple Silicon Macs, with one change:
            pen clicks report the real modifier-key state instead of every flag set, so clicking a
            window activates it and it receives keystrokes.

            Download the .tar.gz below, double-click it to get OpenTabletDriver.app, and replace
            the copy in Applications. First launch: right-click > Open.
          files: ${{ steps.pkg.outputs.file }}
          prerelease: true
